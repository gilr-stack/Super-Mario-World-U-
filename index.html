```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>Super Mario World</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #game {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        /*
         * Tela inicial para liberar o áudio
         */
        #startScreen {

            position: fixed;
            inset: 0;

            z-index: 999999;

            background: #000;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            text-align: center;

            cursor: pointer;
        }

        #startScreen h1 {

            font-size: 28px;

            margin: 0 0 20px 0;

        }

        #startButton {

            background: #0064ff;

            border: none;

            color: white;

            padding: 16px 35px;

            border-radius: 10px;

            font-size: 20px;

            font-weight: bold;

            box-shadow:
                0 4px 15px
                rgba(0, 100, 255, 0.4);

        }

        #startScreen p {

            font-size: 14px;

            opacity: 0.7;

            margin-top: 15px;

        }

    </style>

</head>


<body>


    <!--
         Tela inicial.
         O primeiro toque do usuário será utilizado
         para liberar o áudio do navegador.
    -->

    <div id="startScreen">

        <h1>Super Mario World</h1>

        <button id="startButton">
            ▶ TOQUE PARA JOGAR
        </button>

        <p>
            Toque para iniciar o jogo com áudio
        </p>

    </div>


    <!-- EmulatorJS -->

    <div id="game"></div>


    <script>

        /*
         * ==========================================
         *          EMULATORJS
         * ==========================================
         */

        EJS_player = "#game";

        EJS_core = "snes";

        EJS_color = "#0064ff";

        EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";

        EJS_gameUrl =
            "SupeeMarioWorldBR.smc";


        /*
         * ==========================================
         *              CONTROLES
         * ==========================================
         */

        EJS_VirtualGamepad = true;


        /*
         * ==========================================
         *                ÁUDIO
         * ==========================================
         */

        EJS_audio = true;


        /*
         * Não iniciar automaticamente.
         *
         * O jogo será iniciado depois que o usuário
         * tocar no botão.
         */

        EJS_startOnLoaded = false;


        /*
         * ==========================================
         *              PERFORMANCE
         * ==========================================
         */

        EJS_defaultOptions = {

            "video_driver": "gl",

            "audio_driver": "webaudio"

        };


        /*
         * ==========================================
         *        DETECÇÃO DO DISPOSITIVO
         * ==========================================
         */

        const isMobile =
            /Android|iPhone|iPad|iPod/i.test(
                navigator.userAgent
            );


        /*
         * ==========================================
         *        LIBERAR ÁUDIO DO NAVEGADOR
         * ==========================================
         */

        const startScreen =
            document.getElementById(
                "startScreen"
            );

        const startButton =
            document.getElementById(
                "startButton"
            );


        async function iniciarJogo() {

            /*
             * O ponto mais importante:
             *
             * Esta função é executada diretamente
             * como consequência do toque do usuário.
             *
             * Isso permite que navegadores móveis
             * liberem o áudio.
             */

            try {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (AudioContext) {

                    const audio =
                        new AudioContext();

                    if (
                        audio.state ===
                        "suspended"
                    ) {

                        await audio.resume();

                    }

                    /*
                     * Cria um pequeno buffer silencioso.
                     *
                     * Alguns navegadores móveis
                     * precisam de reprodução real
                     * para liberar o áudio.
                     */

                    const buffer =
                        audio.createBuffer(
                            1,
                            1,
                            22050
                        );

                    const source =
                        audio.createBufferSource();

                    source.buffer = buffer;

                    source.connect(
                        audio.destination
                    );

                    source.start(0);

                }

            } catch (erro) {

                console.log(
                    "Não foi possível inicializar o áudio:",
                    erro
                );

            }


            /*
             * Remove a tela inicial
             */

            startScreen.style.display =
                "none";


            /*
             * Dá um pequeno intervalo para
             * o navegador terminar a inicialização
             */

            setTimeout(function () {

                /*
                 * Caso o EmulatorJS já esteja
                 * carregado, tenta iniciar.
                 */

                if (
                    typeof EJS_start !==
                    "undefined"
                ) {

                    try {

                        EJS_start();

                    } catch (e) {

                        console.log(
                            "EmulatorJS já está inicializando."
                        );

                    }

                }

            }, 100);

        }


        /*
         * O evento precisa ser diretamente
         * associado ao toque.
         */

        startButton.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                iniciarJogo();

            },
            {
                passive: false,
                once: true
            }
        );


        /*
         * Compatibilidade com navegador
         * que não utiliza touchstart.
         */

        startButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                iniciarJogo();

            },
            {
                once: true
            }
        );

    </script>


    <!--
         EmulatorJS
    -->

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>


</body>

</html>
