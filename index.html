</head>


<body>


    <!-- ==============================
         TELA DE CARREGAMENTO
    =============================== -->

    <div id="startScreen">

        <h1>Super Mario World</h1>

        <div id="status">
            Preparando o jogo...
        </div>

        <div id="progressContainer">

            <div id="progress"></div>

        </div>

        <button id="startButton">
            ▶ TOQUE PARA JOGAR
        </button>

    </div>


    <!-- ==============================
         EMULADOR
    =============================== -->

    <div id="game"></div>


    <script>

        /*
         * ==========================================
         * CONFIGURAÇÕES
         * ==========================================
         */

        const ROM_NAME =
            "SupeeMarioWorldBR.smc";

        const ROM_URL =
            "./" + ROM_NAME;

        const DB_NAME =
            "SuperMarioWorldCache";

        const STORE_NAME =
            "roms";


        /*
         * ==========================================
         * ELEMENTOS
         * ==========================================
         */

        const status =
            document.getElementById("status");

        const progress =
            document.getElementById("progress");

        const startButton =
            document.getElementById("startButton");

        const startScreen =
            document.getElementById("startScreen");


        /*
         * ==========================================
         * BANCO DE DADOS
         *
         * A ROM fica armazenada no navegador.
         * ==========================================
         */

        function abrirBanco() {

            return new Promise(
                (resolve, reject) => {

                    const request =
                        indexedDB.open(
                            DB_NAME,
                            1
                        );


                    request.onupgradeneeded =
                        function(event) {

                            const db =
                                event.target.result;

                            if (
                                !db.objectStoreNames
                                    .contains(STORE_NAME)
                            ) {

                                db.createObjectStore(
                                    STORE_NAME
                                );

                            }

                        };


                    request.onsuccess =
                        function(event) {

                            resolve(
                                event.target.result
                            );

                        };


                    request.onerror =
                        function() {

                            reject(
                                request.error
                            );

                        };

                }
            );

        }


        /*
         * ==========================================
         * RECUPERA ROM DO CACHE
         * ==========================================
         */

        async function obterROMCache() {

            const db =
                await abrirBanco();


            return new Promise(
                (resolve, reject) => {

                    const transaction =
                        db.transaction(
                            STORE_NAME,
                            "readonly"
                        );


                    const store =
                        transaction.objectStore(
                            STORE_NAME
                        );


                    const request =
                        store.get(ROM_NAME);


                    request.onsuccess =
                        function() {

                            resolve(
                                request.result || null
                            );

                        };


                    request.onerror =
                        function() {

                            reject(
                                request.error
                            );

                        };

                }
            );

        }


        /*
         * ==========================================
         * SALVA ROM NO CACHE
         * ==========================================
         */

        async function salvarROM(blob) {

            const db =
                await abrirBanco();


            return new Promise(
                (resolve, reject) => {

                    const transaction =
                        db.transaction(
                            STORE_NAME,
                            "readwrite"
                        );


                    const store =
                        transaction.objectStore(
                            STORE_NAME
                        );


                    const request =
                        store.put(
                            blob,
                            ROM_NAME
                        );


                    request.onsuccess =
                        function() {

                            resolve();

                        };


                    request.onerror =
                        function() {

                            reject(
                                request.error
                            );

                        };

                }
            );

        }


        /*
         * ==========================================
         * BAIXA A ROM
         * ==========================================
         */

        async function baixarROM() {

            status.textContent =
                "Baixando o jogo...";

            progress.style.width =
                "0%";


            const resposta =
                await fetch(
                    ROM_URL,
                    {
                        cache: "no-cache"
                    }
                );


            if (!resposta.ok) {

                throw new Error(
                    "Não foi possível encontrar a ROM."
                );

            }


            /*
             * Tamanho total do arquivo
             */

            const tamanho =
                Number(
                    resposta.headers.get(
                        "Content-Length"
                    )
                ) || 0;


            /*
             * Se o navegador suporta
             * leitura progressiva.
             */

            if (
                resposta.body &&
                resposta.body.getReader
            ) {

                const reader =
                    resposta.body.getReader();

                const partes = [];

                let recebido = 0;


                while (true) {

                    const {
                        done,
                        value
                    } = await reader.read();


                    if (done)
                        break;


                    partes.push(value);

                    recebido += value.length;


                    if (tamanho > 0) {

                        const porcentagem =
                            (recebido / tamanho) * 100;

                        progress.style.width =
                            porcentagem + "%";

                    }

                }


                const blob =
                    new Blob(partes, {
                        type:
                            "application/octet-stream"
                    });


                await salvarROM(blob);

                return blob;

            }


            /*
             * Fallback
             */

            const blob =
                await resposta.blob();


            progress.style.width =
                "100%";


            await salvarROM(blob);

            return blob;

        }


        /*
         * ==========================================
         * PREPARA A ROM
         * ==========================================
         */

        async function prepararROM() {

            try {

                /*
                 * Primeiro procura a ROM
                 * no armazenamento local.
                 */

                const cache =
                    await obterROMCache();


                if (cache) {

                    status.textContent =
                        "Jogo pronto!";

                    progress.style.width =
                        "100%";

                    return cache;

                }


                /*
                 * Se não existir,
                 * baixa pela internet.
                 */

                const blob =
                    await baixarROM();


                status.textContent =
                    "Jogo pronto!";


                return blob;

            } catch (erro) {

                console.error(erro);


                status.textContent =
                    "Erro ao carregar o jogo.";


                throw erro;

            }

        }


        /*
         * ==========================================
         * PREPARA O EMULATORJS
         * ==========================================
         */

        let romBlob = null;

        let emuladorIniciado = false;


        prepararROM()

            .then(
                function(blob) {

                    romBlob = blob;

                    /*
                     * Mostra o botão somente quando
                     * a ROM estiver pronta.
                     */

                    startButton.style.display =
                        "block";

                    status.textContent =
                        "Jogo pronto!";

                }
            )

            .catch(
                function(erro) {

                    status.textContent =
                        "Não foi possível carregar a ROM.";

                    console.error(erro);

                }
            );


        /*
         * ==========================================
         * INICIAR JOGO
         * ==========================================
         */

        async function iniciarJogo() {

            if (emuladorIniciado)
                return;


            if (!romBlob) {

                alert(
                    "O jogo ainda está carregando."
                );

                return;

            }


            emuladorIniciado = true;


            /*
             * ======================================
             * LIBERA O ÁUDIO
             *
             * Essa parte acontece diretamente
             * após o toque do usuário.
             * ======================================
             */

            try {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;


                if (AudioContext) {

                    const audioContext =
                        new AudioContext();


                    if (
                        audioContext.state ===
                        "suspended"
                    ) {

                        await audioContext.resume();

                    }


                    /*
                     * Pequeno buffer silencioso.
                     * Ajuda alguns navegadores móveis
                     * a liberar a saída de áudio.
                     */

                    const buffer =
                        audioContext.createBuffer(
                            1,
                            1,
                            22050
                        );


                    const source =
                        audioContext.createBufferSource();


                    source.buffer = buffer;


                    source.connect(
                        audioContext.destination
                    );


                    source.start(0);

                }

            } catch (erro) {

                console.log(
                    "Aviso de áudio:",
                    erro
                );

            }


            /*
             * ======================================
             * CRIA URL LOCAL DA ROM
             * ======================================
             */

            const romLocal =
                URL.createObjectURL(
                    romBlob
                );


            /*
             * ======================================
             * CONFIGURA EMULATORJS
             * ======================================
             */

            window.EJS_player =
                "#game";


            window.EJS_core =
                "snes";


            window.EJS_color =
                "#0064ff";


            window.EJS_pathtodata =
                "https://cdn.emulatorjs.org/stable/data/";


            /*
             * O EmulatorJS agora recebe uma
             * URL local da ROM.
             */

            window.EJS_gameUrl =
                romLocal;


            /*
             * Controles virtuais
             */

            window.EJS_VirtualGamepad =
                true;


            /*
             * Áudio
             */

            window.EJS_audio =
                true;


            /*
             * Não precisamos iniciar
             * automaticamente.
             */

            window.EJS_startOnLoaded =
                true;


            /*
             * Configuração leve para celular.
             */

            window.EJS_defaultOptions = {

                "video_driver": "gl",

                "audio_driver": "webaudio"

            };


            /*
             * ======================================
             * ESCONDE TELA INICIAL
             * ======================================
             */

            startScreen.style.display =
                "none";


            /*
             * ======================================
             * CARREGA EMULATORJS
             * ======================================
             */

            const script =
                document.createElement(
                    "script"
                );


            script.src =
                "https://cdn.emulatorjs.org/stable/data/loader.js";


            script.async = true;


            document.body.appendChild(
                script
            );

        }


        /*
         * ==========================================
         * BOTÃO MOBILE
         * ==========================================
         */

        startButton.addEventListener(
            "click",
            iniciarJogo,
            {
                once: true
            }
        );


        startButton.addEventListener(
            "touchend",
            function(event) {

                event.preventDefault();

                iniciarJogo();

            },
            {
                passive: false
            }
        );


    </script>

</body>

</html>
