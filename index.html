<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario World - EmulatorJS</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <script>
        // Configurações do EmulatorJS
        EJS_player = "#game-container";
        EJS_core = "snes";
        EJS_pathtodata = "https://emulatorjs.org";
        
        // SOLUÇÃO: Como a ROM está no mesmo servidor do GitHub Pages, 
        // basta colocar o nome do arquivo diretamente (caminho relativo)!
        EJS_gameUrl = "SuperMarioWorldBR.smc"; 
    </script>
    <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
