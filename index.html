<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario World - EmulatorJS</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }
        #game {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>

    <div style="width:100%; height:100%;">
        <div id="game"></div>
    </div>

    <script>
        EJS_player = "#game";
        EJS_core = "snes";
        EJS_pathtodata = "https://emulatorjs.org";
        
        // Garante o link direto dentro do próprio repositório
        EJS_gameUrl = "./SuperMarioWorldBR.smc"; 
    </script>
    <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
