<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogar SNES Online</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="game"></div>

    <script>
        // CONFIGURAÇÃO DO EMULADOR DE SNES
        // MUDE APENAS O TEXTO ENTRE ASPAS ABAIXO para o nome exato do seu arquivo no GitHub (ex: "mario.sfc" ou "topgear.smc")
        const NOME_DO_ARQUIVO_DO_JOGO = "seu_jogo.sfc"; 

        window.EJS_player = '#game';
        window.EJS_core = 'snes'; // Define o emulador como Super Nintendo
        window.EJS_gameUrl = "Super Mario World (U) [T+Por].smc"; 
        window.EJS_pathtodata = 'https://jsdelivr.net';
    </script>
    <script src="https://jsdelivr.netloader.js"></script>

</body>
</html>
