<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- Melhor configuração para celulares -->
    <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover">

    <title>Super Mario World</title>

    <style>
        /* Remove margens e barras de rolagem */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Área do EmulatorJS */
        #game {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: fixed;
            inset: 0;
            background: #000;
        }

        /* Canvas do jogo */
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Evita seleção e zoom acidental no celular */
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <div id="game"></div>

    <script>
        /*
         * ==========================================
         *        CONFIGURAÇÃO EMULATORJS
         * ==========================================
         */

        // Local onde o EmulatorJS será exibido
        EJS_player = "#game";

        // Core do Super Nintendo
        EJS_core = "snes";

        // Cor da interface
        EJS_color = "#0064ff";

        // Arquivos do EmulatorJS
        EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";

        // Sua ROM
        EJS_gameUrl = "SupeeMarioWorldBR.smc";


        /*
         * ==========================================
         *          CONFIGURAÇÕES MOBILE
         * ==========================================
         */

        // Ativa controles virtuais para celulares
        EJS_VirtualGamepad = true;

        // Inicia o jogo assim que estiver carregado
        EJS_startOnLoaded = true;

        /*
         * Tentativa de utilizar WebAudio.
         * Normalmente oferece melhor compatibilidade
         * de áudio em navegadores modernos.
         */
        EJS_audio = true;


        /*
         * ==========================================
         *              DESEMPENHO
         * ==========================================
         */

        /*
         * Evita recursos gráficos pesados.
         * Para SNES não precisamos de filtros ou shaders.
         */

        EJS_defaultOptions = {
            "video_driver": "gl",
            "audio_driver": "webaudio"
        };


        /*
         * ==========================================
         *       AJUSTES ESPECÍFICOS DO NAVEGADOR
         * ==========================================
         */

        // Detecta dispositivos móveis
        const isMobile =
            /Android|iPhone|iPad|iPod/i.test(
                navigator.userAgent
            );

        if (isMobile) {

            /*
             * Mantém o processamento gráfico simples.
             * Isso ajuda principalmente em celulares
             * de entrada.
             */

            document.documentElement.style.touchAction = "none";
            document.body.style.touchAction = "none";
        }


        /*
         * ==========================================
         *       LIBERAÇÃO DO ÁUDIO NO PRIMEIRO TOQUE
         * ==========================================
         *
         * Navegadores móveis podem bloquear áudio
         * até que o usuário toque na página.
         */

        function liberarAudio() {

            try {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (AudioContext) {

                    const audioContext =
                        new AudioContext();

                    if (audioContext.state === "suspended") {
                        audioContext.resume();
                    }
                }

            } catch (e) {
                console.log(
                    "Áudio aguardando inicialização."
                );
            }

            // Remove os eventos depois do primeiro toque
            document.removeEventListener(
                "touchstart",
                liberarAudio
            );

            document.removeEventListener(
                "click",
                liberarAudio
            );
        }


        /*
         * O navegador libera o áudio depois
         * da primeira interação do usuário.
         */

        document.addEventListener(
            "touchstart",
            liberarAudio,
            { once: true }
        );

        document.addEventListener(
            "click",
            liberarAudio,
            { once: true }
        );

    </script>


    <!-- EmulatorJS -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>

</html>
